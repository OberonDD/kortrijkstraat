<style>

.gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }

/* Layout: a working site sheet — header + live totals, three tabs (house / paperwork / subsidies), filter bar, then one spreadsheet grid (cards on phones) with a side panel for details. Accent = carpenter's chalk-line blue on concrete grey. */
:root {
  --bg: #eceef1;
  --surface: #fafbfc;
  --sunk: #e3e6ea;
  --ink: #1a1e26;
  --muted: #5b6372;
  --line: #d3d8df;
  --accent: #2c4bd4;
  --accent-soft: #dfe5fb;
  --on-accent: #ffffff;
  --p1: #c4372c; --p1-soft: #f8e1de;
  --p2: #b8730a; --p2-soft: #f6ead3;
  --p3: #4c5b70; --p3-soft: #e3e7ed;
  --p4: #8b929c; --p4-soft: #eceef1;
  --ok: #2b8150; --ok-soft: #dcefe3;
  --warn: #a8610a; --warn-soft: #f7ebd8;
  --shadow: 0 12px 40px rgba(20, 26, 40, .18);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161b; --surface: #1b1f26; --sunk: #232831; --ink: #e6e9ee; --muted: #98a1af; --line: #2d333d;
    --accent: #8296ff; --accent-soft: #252d4f; --on-accent: #0f1320;
    --p1: #ff7f73; --p1-soft: #3d2221; --p2: #f0b34f; --p2-soft: #3a2f1b; --p3: #a9b6c9; --p3-soft: #283040; --p4: #7d8592; --p4-soft: #21252c;
    --ok: #63c98b; --ok-soft: #1c3426; --warn: #f0b34f; --warn-soft: #3a2f1b;
    --shadow: 0 12px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13161b; --surface: #1b1f26; --sunk: #232831; --ink: #e6e9ee; --muted: #98a1af; --line: #2d333d;
  --accent: #8296ff; --accent-soft: #252d4f; --on-accent: #0f1320;
  --p1: #ff7f73; --p1-soft: #3d2221; --p2: #f0b34f; --p2-soft: #3a2f1b; --p3: #a9b6c9; --p3-soft: #283040; --p4: #7d8592; --p4-soft: #21252c;
  --ok: #63c98b; --ok-soft: #1c3426; --warn: #f0b34f; --warn-soft: #3a2f1b;
  --shadow: 0 12px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: flex; flex-direction: column; gap: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }

.brand h1 span { color: var(--accent); }
.brand p { margin: 6px 0 0; color: var(--muted); }

.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--p4); display: inline-block; }
.sync.live i { background: var(--ok); }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.stat { padding: 12px 16px; border-left: 1px solid var(--line); min-width: 0; }

.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.15; margin-top: 2px; font-variant-numeric: tabular-nums; }

@media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat { border-left: 0; border-top: 1px solid var(--line); } .stat:nth-child(-n+2) { border-top: 0; } .stat:nth-child(2n) { border-left: 1px solid var(--line); } .stat:last-child { grid-column: 1 / -1; border-left: 0; } }

.banner { padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }

.tab:hover { color: var(--ink); }

.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Room chips */
.roomrow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.rchip { all: unset; cursor: pointer; white-space: nowrap; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }

.roomcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.rc-head { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
.rc-head h2 { font-family: var(--f-display); font-weight: 700; font-size: 24px; margin: 0; letter-spacing: -.01em; flex: 1 1 auto; }

.rc-money { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 12px 16px; align-items: end; }
.rc-budget input { font-family: var(--f-mono); }
.rc-barwrap { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rc-bar { position: relative; height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.rc-bar span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 6px; }

.sw.spent { background: var(--accent); }

.roomcard textarea { min-height: 70px; }
@media (max-width: 560px) { .rc-money { grid-template-columns: minmax(0, 1fr); } .rc-head h2 { font-size: 21px; } }
.rchip.add { border-style: dashed; color: var(--accent); font-weight: 600; }
.linkbtn.small { font-size: 12px; font-weight: 600; margin-top: 4px; align-self: flex-start; }
.panel-h { font-family: var(--f-display); font-size: 20px; margin: 0; }
.roomlist { display: flex; flex-direction: column; gap: 6px; }
.roomrow-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); flex-wrap: wrap; }

.roomadd { display: flex; gap: 8px; flex-wrap: wrap; }

.addbar { display: flex; gap: 8px; flex-wrap: wrap; }
.addbar input { flex: 1 1 260px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-size: 15px; }
.addbar select { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-width: 100%; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: var(--r); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; padding-inline: 18px; }
.btn.primary:hover { filter: brightness(1.07); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .search { flex: 1 1 200px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }

.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: auto; max-height: 72vh; }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }

.grid.house td:nth-child(3), .grid.house th:nth-child(3), .grid.admin td:nth-child(3), .grid.admin th:nth-child(3) { min-width: 340px; }
.grid.house td:nth-child(4), .grid.house th:nth-child(4) { min-width: 140px; }
.grid.house td:nth-child(5), .grid.house th:nth-child(5) { min-width: 150px; }
.grid.house td:nth-child(6), .grid.house th:nth-child(6), .grid.admin td:nth-child(5), .grid.admin th:nth-child(5) { min-width: 125px; }

.grid.house td:nth-child(9), .grid.house th:nth-child(9) { min-width: 180px; }
.grid.house td:nth-child(10), .grid.house th:nth-child(10), .grid.admin td:nth-child(9), .grid.admin th:nth-child(9) { min-width: 170px; }
.grid.house td:nth-child(11), .grid.house th:nth-child(11), .grid.house td:nth-child(12), .grid.house th:nth-child(12), .grid.admin td:nth-child(10), .grid.admin th:nth-child(10) { min-width: 105px; }
.grid.house td:nth-child(13), .grid.house th:nth-child(13), .grid.admin td:nth-child(11), .grid.admin th:nth-child(11) { min-width: 220px; }
.grid.admin td:nth-child(4), .grid.admin th:nth-child(4) { min-width: 175px; }
.grid.admin td:nth-child(8), .grid.admin th:nth-child(8) { min-width: 145px; }
/* freeze row number, done box and title while scrolling sideways */
.grid.house tbody td:nth-child(-n+3), .grid.admin tbody td:nth-child(-n+3), .grid.house tfoot td:nth-child(-n+3), .grid.admin tfoot td:nth-child(-n+3) { position: sticky; z-index: 1; }
.grid.house thead th:nth-child(-n+3), .grid.admin thead th:nth-child(-n+3) { left: 0; z-index: 3; }

.grid.house tr > :nth-child(2), .grid.admin tr > :nth-child(2) { left: 40px; width: 36px; min-width: 36px; max-width: 36px; }
.grid.house tr > :nth-child(3), .grid.admin tr > :nth-child(3) { left: 76px; box-shadow: 1px 0 0 var(--line); }
.grid.house thead th:nth-child(2), .grid.admin thead th:nth-child(2) { left: 40px; }
.grid.house thead th:nth-child(3), .grid.admin thead th:nth-child(3) { left: 76px; }
.grid.house tbody td.chk, .grid.house tbody td.titlecell, .grid.admin tbody td.chk, .grid.admin tbody td.titlecell { background: var(--surface); }
.grid.house tr.group td, .grid.admin tr.group td { position: static; }
.grid.house tfoot td:nth-child(-n+3), .grid.admin tfoot td:nth-child(-n+3) { z-index: 2; }
table.grid.subs { min-width: 900px; }
table.grid.done { min-width: 1240px; }
.grid.done td:nth-child(10) { min-width: 150px; }
.grid.done td:nth-child(3) { min-width: 300px; }
.done-title { display: block; padding: 8px 10px; color: var(--muted); }
.card.done-card .t { color: var(--muted); }
.grid th, .grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; vertical-align: middle; text-align: left; }
.grid th:last-child, .grid td:last-child { border-right: 0; }
.grid thead th { position: sticky; top: 0; z-index: 2; background: var(--sunk); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.grid thead th button { all: unset; display: flex; align-items: center; gap: 4px; padding: 8px 10px; cursor: pointer; width: 100%; box-sizing: border-box; }
.grid thead th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.grid thead th .arr { opacity: .35; font-size: 10px; }
.grid thead th.sorted .arr { opacity: 1; color: var(--accent); }
.grid th.r button { justify-content: flex-end; }
.grid td.r { text-align: right; }

.grid tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }

.grid tr.done td:not(.idx):not(.chk) { color: var(--muted); }
.grid tr.done .cell-title { text-decoration: line-through; text-decoration-color: var(--line); }
.cell { width: 100%; border: 0; background: transparent; padding: 8px 10px; min-height: 36px; border-radius: 0; }
.cell:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--surface); }
select.cell { cursor: pointer; appearance: none; -webkit-appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 12px) 52%, calc(100% - 8px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }

.chipcell { padding: 6px 10px; }

.open-btn { all: unset; cursor: pointer; padding: 8px 12px; color: var(--accent); font-weight: 600; font-size: 13px; white-space: nowrap; }

      if (!pays.length && hasNum(t.actualCost)) pays.push({ id: newId(), date: t.doneAt || today(), amount: Number(t.actualCost), kind: "other", note: "Eerder als één bedrag ingevuld" });
      const p = { id: newId(), date: today(), amount: null, kind: "invoice", note: "" };
      pendingFocus = `[data-pid="${p.id}"] [data-pay="amount"]`;
      writePays(t, [...pays, p]); return true;
    }
    const pd = e.target.closest("[data-paydel]");
    if (pd) {
      const prev = { payments: paysOf(t), actualCost: t.actualCost ?? null }, p = prev.payments.find((x) => x.id === pd.dataset.paydel);
      writePays(t, prev.payments.filter((x) => x.id !== pd.dataset.paydel));
      toast(`Betaling${p && hasNum(p.amount) ? " van " + eur(p.amount) : ""} weggehaald`, () => patch(t.id, prev)); return true;
    }
    return false;
  }
  function flushTimers() { for (const k in textTimers) { clearTimeout(textTimers[k].t); textTimers[k].fn(); } textTimers = {}; }
  function closePanel() {
    flushTimers();
    const a = document.activeElement;
    if (panel && a && a.closest && a.closest("#pMoney")) { if (a.dataset.q && a.dataset.q !== "signed") onQuoteField(a); else if (a.dataset.pay) onPayField(a); }
    panel = null; $("#panel").hidden = true; $("#scrim").hidden = true; document.body.style.overflow = ""; $("#panel").innerHTML = ""; }
  function panelCommit(el) {
    if (!panel) return;
    const isSub = panel.type === "sub", f = isSub ? el.dataset.sp : el.dataset.p;
    const rec = isSub ? subById.get(panel.id) : byId.get(panel.id); if (!rec) return;
    let v = MONEY.includes(f) ? parseNum(el.value) : f === "priority" ? Number(el.value) : el.value;
    if (typeof v === "string" && f !== "notes" && f !== "conditions") v = v.trim();
    if ((f === "title" || f === "name") && !v) { el.value = rec[f]; return; }
    if ((rec[f] ?? "") === (v ?? "")) return;
    const fields = { [f]: v };
    if (f === "status" && !isSub) fields.doneAt = v === "done" ? today() : "";
    const s = document.querySelector(".panel .saved"); if (s) s.textContent = "Bewaren…";
    (isSub ? patchSub : patch)(rec.id, fields);
  }
  function addTool(raw) {
    const t = byId.get(panel && panel.id); if (!t) return;
    const vals = String(raw).split(",").map((x) => x.trim()).filter(Boolean);
    const cur = toolsOf(t), next = [...cur];
    vals.forEach((v) => { if (!next.some((x) => x.toLowerCase() === v.toLowerCase())) next.push(v); });
    if (next.length !== cur.length) patch(t.id, { tools: next });
  }
  $("#panel").addEventListener("input", (e) => {
    const el = e.target, key = el.dataset.p || el.dataset.sp; if (!key || el.tagName === "SELECT" || el.type === "date") return;
    if (!panel || panel.type === "rooms") return;
    const p = panel; if (textTimers[key]) clearTimeout(textTimers[key].t);
    const fn = () => { if (panel === p) panelCommit(el); delete textTimers[key]; };
    textTimers[key] = { t: setTimeout(fn, 700), fn };
  });
  $("#panel").addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.q) { onQuoteField(el); return; }
    if (el.dataset.pay) { onPayField(el); return; }
    if (el.closest("#pDeps")) {
      const t = byId.get(panel.id); if (!t) return;
      const set = new Set(t.dependsOn || []); el.checked ? set.add(el.value) : set.delete(el.value);
      const s = document.querySelector(".panel .saved"); if (s) s.textContent = "Bewaren…";
      patch(t.id, { dependsOn: [...set] }); return;
    }
    if (el.id === "pToolIn") { if (el.value.trim()) { addTool(el.value); el.value = ""; } return; }
    if (el.dataset.rname) {
      const rid = el.dataset.rname, r = roomById.get(rid), name = el.value.trim();
      if (!r) return;
      if (!name) { el.value = r.name; return; }
      if (name === r.name) return;
      if (roomNameTaken(name, rid)) { toast(`Er is al een kamer met die naam.`); el.value = r.name; return; }
      write(roomCol, rid, { name }); toast(`Hernoemd naar “${name}”`);
      return;
    }
    if (el.id === "newRoom") return;
    const key = el.dataset.p || el.dataset.sp; if (!key) return;
    if (textTimers[key]) { clearTimeout(textTimers[key].t); delete textTimers[key]; }
    panelCommit(el);
    if (MONEY.includes(key)) el.value = key === "hours" ? numIn(parseNum(el.value)) : amtIn(parseNum(el.value));
  });
  $("#panel").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.dataset && e.target.dataset.rname) { e.preventDefault(); e.target.blur(); return; }
    if (e.key === "Enter" && e.target.tagName === "INPUT" && (e.target.dataset.q || e.target.dataset.pay || e.target.id === "pEst")) { e.preventDefault(); e.target.blur(); return; }
    if (e.target.id === "pToolIn" && (e.key === "Enter" || e.key === ",")) { e.preventDefault(); if (e.target.value.trim()) { addTool(e.target.value); e.target.value = ""; } }
    else if (e.target.id === "pToolIn" && e.key === "Backspace" && !e.target.value) { const t = byId.get(panel.id); const cur = toolsOf(t); if (cur.length) patch(t.id, { tools: cur.slice(0, -1) }); }
  });
  $("#panel").addEventListener("submit", async (e) => {
    if (e.target.id !== "roomAdd") return;
    e.preventDefault();
    const inp = $("#newRoom"), name = inp.value;
    try { const ref = await addRoom(name); if (ref) { inp.value = ""; renderRoomsList(true); inp.focus(); } } catch (err) { handleWriteErr(err); }
  });
  $("#panel").addEventListener("click", async (e) => {
    const id = e.target.id;
    if (id === "pClose") return closePanel();
    if (e.target.closest("#pMoney") && moneyClick(e)) return;
    if (e.target.closest("[data-rooms]")) { openRooms(); return; }
    const ro = e.target.closest("[data-ropen]"); if (ro) { openRoomPage(ro.dataset.ropen); return; }
    const mv = e.target.closest("[data-rmove]");
    if (mv) {
      const rid = mv.closest("[data-rid]").dataset.rid, list = sortedRooms(), i = list.findIndex((r) => r.id === rid), j = mv.dataset.rmove === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      list.forEach((r, k) => { r._o = k + 1; }); [list[i]._o, list[j]._o] = [list[j]._o, list[i]._o];
      list.forEach((r) => { if (r.order !== r._o) write(roomCol, r.id, { order: r._o }); });
      return;
    }
    const del = e.target.closest("[data-rdel]");
    if (del) {
      const row = del.closest("[data-rid]"), rid = row.dataset.rid, r = roomById.get(rid);
      const n = tasks.filter((t) => roomIdOf(t) === rid).length;
      row.insertAdjacentHTML("afterend", `<div class="confirm rconfirm" data-rconfirm="${esc(rid)}"><span>“${esc(r ? r.name : "")}” verwijderen?${n ? (n === 1 ? " De klus erin gaat naar “Nog geen kamer”." : ` De ${n} klussen erin gaan naar “Nog geen kamer”.`) : ""}</span><button class="btn danger" type="button" data-rdelyes="${esc(rid)}">Ja, verwijderen</button><button class="btn" type="button" data-rdelno>Toch houden</button></div>`);
      del.disabled = true;
      return;
    }
    if (e.target.closest("[data-rdelno]")) { renderRoomsList(true); return; }
    const yes = e.target.closest("[data-rdelyes]");
    if (yes) {
      const rid = yes.dataset.rdelyes, r = roomById.get(rid);
      for (const t of tasks) if (roomIdOf(t) === rid) patch(t.id, { roomId: "" });
      roomCol.doc(rid).delete().catch(handleWriteErr);
      if (st.house.room === rid) { st.house.room = ""; saveView(); }
      toast(`Kamer “${r ? r.name : ""}” verwijderd`);
      return;
    }
    const rm = e.target.closest("[data-rmtool]");
    if (rm) { const t = byId.get(panel.id); patch(t.id, { tools: toolsOf(t).filter((x) => x !== rm.dataset.rmtool) }); return; }
    const op = e.target.closest("[data-open]"); if (op) { openTask(op.dataset.open); return; }
    if (id === "pMove") {
      const t = byId.get(panel.id); const to = kindOf(t) === "house" ? "admin" : "house";
      patch(t.id, { kind: to }); toast(`Verplaatst naar ${to === "admin" ? "Papierwerk" : "In huis"}`); setTimeout(() => openTask(t.id), 80); return;
    }
    if (id === "pDel") $("#pDelWrap").innerHTML = `<span>Voor jullie allebei verwijderen?</span><button class="btn danger" type="button" id="pDelYes">Ja, verwijderen</button><button class="btn" type="button" id="pDelNo">Toch houden</button>`;
    if (id === "pDelNo") $("#pDelWrap").innerHTML = `<button class="btn danger" type="button" id="pDel">Verwijderen</button>`;
    if (id === "pDelYes") {
      const p = panel; closePanel();
      try {
        if (p.type === "sub") {
          const s = subById.get(p.id);
          subCol.doc(p.id).delete().catch(handleWriteErr);
          for (const t of linkedTasks(p.id)) patch(t.id, { subsidyId: "" });
          toast(`“${s ? s.name : "Premie"}” verwijderd`);
        } else {
          const t = byId.get(p.id);
          col.doc(p.id).delete().catch(handleWriteErr);
          for (const o of tasks) if ((o.dependsOn || []).includes(p.id)) patch(o.id, { dependsOn: o.dependsOn.filter((x) => x !== p.id) });
          toast(`“${t ? t.title : "Item"}” verwijderd`);
        }
      } catch (err) { handleWriteErr(err); }
    }
  });
  $("#scrim").addEventListener("click", closePanel);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && panel) closePanel(); });

  // ---------- export ----------
  let downloadsNS = null;
  async function exportCsv() {
    if (!downloadsNS) return;
    const q = (v) => { const s = String(v ?? ""); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const n = (v) => v == null || v === "" ? "" : String(v).replace(".", ",");
    let head, rows;
    if (st.tab === "done") {
      head = ["Afgewerkt", "Lijst", "Kamer / categorie", "Gedaan op", "Gedaan door", "Wie", "Uren", "Uitgegeven EUR", "Gepland EUR", "Verschil EUR", "Notities"];
      rows = sortDone(visibleDone()).map((t) => [t.title, kindOf(t) === "house" ? "In huis" : "Papierwerk", whereOf(t), doneKey(t), byL(t.doneBy), ownL(t.owner), n(t.hours), n(t.actualCost), n(t.estCost), varianceOf(t) ? n(varianceOf(t).d) : "", t.notes]);
    } else if (st.tab === "budget") {
      head = ["Kamer of lijst", "Open klussen", "Gedane klussen", "Budget EUR", "Gepland EUR", "Uitgegeven EUR", "Verwacht eindbedrag EUR", "Over (+) / te veel (-) EUR"];
      rows = sortBudget(budgetRows()).map((r) => [r.name, r.open, r.done, n(r.budget), n(r2(r.planned)), n(r2(r.spent)), n(r2(r.expected)), n(r.diff)]);
      const pn = planNumbers();
      rows.push([], ["Totaal budget", "", "", n(pn.total)], ["Buffer %", "", "", n(pn.bufPct)], ["Premies", "", "", n(r2(subsTotal()))]);
    } else if (st.tab === "subs") {
      head = ["Premie", "Status", "Verwacht EUR", "Ontvangen EUR", "Aanvragen voor", "Gekoppelde klussen", "Voorwaarden", "Website", "Notities"];
      rows = visibleSubs().map((s) => [s.name, SUB[s.status] || "", n(s.expected), n(s.received), s.deadline, linkedTasks(s.id).map((t) => t.title).join(", "), s.conditions, s.link, s.notes]);
    } else {
      const kind = st.tab;
      head = ["Item", "Lijst", "Kamer", "Soort werk", "Categorie", "Prioriteit", "Status", "Wie", "Gedaan door", "Uren", "Tegen", "Gepland EUR", "Prijs op basis van", "Gekozen offerte van", "Uitgegeven EUR", "Betalingen", "Gereedschap & materiaal", "Premie", "Wacht op", "Notities"];
      rows = sortTasks(visibleTasks(kind), st[kind]).map((t) => [t.title, kind === "house" ? "In huis" : "Papierwerk", roomName(roomIdOf(t)), trL(t.trade), catL(t.category), "P" + (t.priority || 3), STATUS[t.status] || "", ownL(t.owner), byL(t.doneBy), n(t.hours), t.due, n(t.estCost), STAGE[stageOf(t)], estDerived(t) ? chosenQuote(t).who || "" : "", n(t.actualCost), paysOf(t).length, toolsOf(t).join(", "), (subById.get(t.subsidyId) || {}).name || "", deps(t).map((d) => d.title).join(", "), t.notes]);
    }
    const csv = "﻿" + [head, ...rows].map((r) => r.map(q).join(";")).join("\r\n");
    const name = { house: "klussen", admin: "papierwerk", subs: "premies", done: "gedaan", budget: "budget" }[st.tab];
    try { await downloadsNS.save({ filename: `kortrijkstraat-17-${name}-${today()}.csv`, data: csv }); toast("Bewaard. Het bestand opent in Excel of Numbers."); }
    catch (e) { if (e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "Er staat al een download klaar." : "Exporteren lukt hier niet."); }
  }

  // ---------- boot (Firebase) ----------
  downloadsNS = {
    async save({ filename, data }) {
      const type = filename.endsWith(".json") ? "application/json" : "text/csv;charset=utf-8";
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type }));
      a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return { status: "saved" };
    },
  };
  setupTab();

  const showApp = (on) => { $("#app").hidden = !on; $("#gate").hidden = on; };
  function setSync(text, live) { const s = $("#sync"); s.classList.toggle("live", !!live); s.querySelector("span").textContent = text; }

  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE")) {
    loadedT = loadedS = true; canWrite = false;
    const b = $("#banner"); b.textContent = "De installatie is niet af: plak je Firebase-configuratie bovenaan het script in index.html (zie README, stap 3)."; b.hidden = false;
    $("#addForm").hidden = true; setSync("Niet verbonden"); render();
    return;
  }

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  let fs;
  try { fs = initializeFirestore(app, { localCache: persistentLocalCache() }); } catch (e) { fs = getFirestore(app); }

  const wrapCol = (name) => {
    const ref = collection(fs, name);
    return {
      path: name,
      doc: (id) => ({ update: (f) => updateDoc(doc(fs, name, id), f), delete: () => deleteDoc(doc(fs, name, id)) }),
      set: (id, data) => setDoc(doc(fs, name, id), data, { merge: true }),
      add: (data) => addDoc(ref, data).catch(handleWriteErr),
      onSnapshot: (next, err) => onSnapshot(ref, { includeMetadataChanges: true }, (snap) => next({
        fromCache: snap.metadata.fromCache,
        docs: snap.docs.map((d) => ({ id: d.id, exists: true, data: () => d.data() })),
      }), err),
    };
  };

  // sign-in gate
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  $("#gateBtn").addEventListener("click", async () => {
    $("#gateErr").textContent = "";
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      const c = e && e.code;
      if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return;
      if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") { try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; } }
      $("#gateErr").textContent = c === "auth/unauthorized-domain"
        ? "Dit webadres is nog niet toegelaten. Voeg in Firebase → Authentication → Settings → Authorized domains dit toe: " + location.hostname + "."
        : "Aanmelden is niet gelukt (" + (e && e.code || "onbekende fout") + "). Probeer opnieuw.";
    }
  });
  getRedirectResult(auth).catch((e) => { $("#gateErr").textContent = "Aanmelden is niet gelukt (" + (e && e.code) + ")."; });
  const doSignOut = () => signOut(auth);
  $("#signOutBtn").addEventListener("click", doSignOut);
  $("#gateOut").addEventListener("click", doSignOut);

  let unsubs = [];
  function showDenied(email) {
    unsubs.forEach((f) => f()); unsubs = [];
    showApp(false);
    $("#gateMsg").textContent = (email || "Dit account") + " heeft geen toegang tot deze lijst. Meld je aan met het Google-account dat Oberon heeft toegevoegd.";
    $("#gateBtn").hidden = true; $("#gateOut").hidden = false;
  }
  onAuthStateChanged(auth, (u) => {
    unsubs.forEach((f) => f()); unsubs = [];
    closePanel();
    if (!u) {
      showApp(false);
      $("#gateMsg").textContent = "Meld je aan met je Google-account om de gedeelde werkenlijst te openen.";
      $("#gateBtn").hidden = false; $("#gateOut").hidden = true; $("#acct").hidden = true;
      return;
    }
    showApp(true);
    $("#acct").hidden = false; $("#acctEmail").textContent = u.email || "";
    canWrite = true; $("#addForm").hidden = false; $("#banner").hidden = true;
    col = wrapCol("tasks"); subCol = wrapCol("subsidies"); roomCol = wrapCol("rooms");
    tasks = []; subs = []; rooms = []; byId = new Map(); subById = new Map(); roomById = new Map(); loadedT = loadedS = loadedR = false;
    setSync("Verbinden…"); render();
    const onErr = (err) => {
      if (err && err.code === "permission-denied") return showDenied(u.email);
      setSync("Verbinding verbroken · herlaad de pagina");
    };
    unsubs.push(col.onSnapshot((snap) => {
      tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      byId = new Map(tasks.map((t) => [t.id, t])); loadedT = true;
      setSync(snap.fromCache ? "Offline · wijzigingen worden later gesynchroniseerd" : "Live · gedeeld", !snap.fromCache); render();
    }, onErr));
    unsubs.push(subCol.onSnapshot((snap) => {
      subs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      subById = new Map(subs.map((s) => [s.id, s])); loadedS = true; render();
    }, onErr));
    unsubs.push(roomCol.onSnapshot((snap) => {
      rooms = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      roomById = new Map(rooms.map((r) => [r.id, r])); loadedR = true; render();
    }, onErr));
  });

  // backup & import
  $("#backupBtn").addEventListener("click", () => {
    const strip = (r) => { const { id, ...rest } = r; return rest; };
    const out = { format: "kortrijkstraat-17-backup", version: 1, exportedAt: new Date().toISOString(),
      tasks: Object.fromEntries(tasks.map((t) => [t.id, strip(t)])), subsidies: Object.fromEntries(subs.map((s) => [s.id, strip(s)])), rooms: Object.fromEntries(rooms.map((r) => [r.id, strip(r)])) };
    downloadsNS.save({ filename: `kortrijkstraat-17-backup-${today()}.json`, data: JSON.stringify(out, null, 1) });
  });
  const pickFile = () => { if (!canWrite) { toast("Meld je eerst aan."); return; } $("#importIn").value = ""; $("#importIn").click(); };
  $("#importBtn").addEventListener("click", pickFile);
  $("#importHintBtn").addEventListener("click", pickFile);
  let pendingImport = null;
  async function runImport(data) {
    const entries = [
      ...Object.entries(data.tasks || {}).map(([id, b]) => ["tasks", id, b]),
      ...Object.entries(data.subsidies || {}).map(([id, b]) => ["subsidies", id, b]),
      ...Object.entries(data.rooms || {}).map(([id, b]) => ["rooms", id, b]),
    ];
    try {
      for (let i = 0; i < entries.length; i += 400) {
        const batch = writeBatch(fs);
        entries.slice(i, i + 400).forEach(([c, id, body]) => batch.set(doc(fs, c, id), body));
        await batch.commit();
      }
      toast(`${entries.length} items geïmporteerd.`);
    } catch (e) { handleWriteErr(e); }
  }
  $("#importIn").addEventListener("change", async (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); } catch (err) { toast("Dat bestand is geen back-up van deze lijst."); return; }
    if (!data || data.format !== "kortrijkstraat-17-backup") { toast("Dat bestand is geen back-up van deze lijst."); return; }
    const n = Object.keys(data.tasks || {}).length + Object.keys(data.subsidies || {}).length + Object.keys(data.rooms || {}).length;
    if (!tasks.length && !subs.length) return runImport(data);
    pendingImport = data;
    const c = $("#importConfirm");
    c.innerHTML = `<span>${n} items importeren? Items met dezelfde ID worden vervangen door de versie uit de back-up.</span><button class="btn" type="button" id="impYes">Importeren</button><button class="btn" type="button" id="impNo">Annuleren</button>`;
    c.hidden = false;
  });
  $("#importConfirm").addEventListener("click", (e) => {
    if (e.target.id === "impYes" && pendingImport) { runImport(pendingImport); }
    if (e.target.id === "impYes" || e.target.id === "impNo") { pendingImport = null; $("#importConfirm").hidden = true; }
  });
})();
</script>

</body>
